<title>Release OS — archivio artisti e release</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#FFFFFF;
    --bg-sub:#F7F7F5;
    --bg-hover:#F1F1EF;
    --bg-sunken:#FBFBFA;
    --text:#1D1D1F;
    --text-2:#6B6B70;
    --text-3:#9C9CA2;
    --line:#EAEAE7;
    --line-2:#DEDEDA;
    --accent:#2F6BEA;
    --accent-soft:rgba(47,107,234,.09);
    --solid:#1D1D1F;
    --solid-text:#FFFFFF;
    --ok:#1B8A50;
    --ok-soft:rgba(27,138,80,.1);
    --warn:#A8720C;
    --warn-soft:rgba(168,114,12,.1);
    --bad:#B8402F;
    --bad-soft:rgba(184,64,47,.09);
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.09);
    --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
    --f-mono:ui-monospace,"SF Mono",Menlo,"Cascadia Mono",monospace;
    --side:246px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#191919; --bg-sub:#1F1F1F; --bg-hover:#2A2A2A; --bg-sunken:#1C1C1C;
      --text:#ECECEC; --text-2:#9C9C9F; --text-3:#6F6F73;
      --line:#2C2C2C; --line-2:#3A3A3A;
      --accent:#7BA3FF; --accent-soft:rgba(123,163,255,.12);
      --solid:#F5F5F5; --solid-text:#161616;
      --ok:#57C98A; --ok-soft:rgba(87,201,138,.13);
      --warn:#E0A94A; --warn-soft:rgba(224,169,74,.13);
      --bad:#E0705C; --bad-soft:rgba(224,112,92,.13);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#191919; --bg-sub:#1F1F1F; --bg-hover:#2A2A2A; --bg-sunken:#1C1C1C;
    --text:#ECECEC; --text-2:#9C9C9F; --text-3:#6F6F73;
    --line:#2C2C2C; --line-2:#3A3A3A;
    --accent:#7BA3FF; --accent-soft:rgba(123,163,255,.12);
    --solid:#F5F5F5; --solid-text:#161616;
    --ok:#57C98A; --ok-soft:rgba(87,201,138,.13);
    --warn:#E0A94A; --warn-soft:rgba(224,169,74,.13);
    --bad:#E0705C; --bad-soft:rgba(224,112,92,.13);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#FFFFFF; --bg-sub:#F7F7F5; --bg-hover:#F1F1EF; --bg-sunken:#FBFBFA;
    --text:#1D1D1F; --text-2:#6B6B70; --text-3:#9C9CA2;
    --line:#EAEAE7; --line-2:#DEDEDA;
    --accent:#2F6BEA; --accent-soft:rgba(47,107,234,.09);
    --solid:#1D1D1F; --solid-text:#FFFFFF;
    --ok:#1B8A50; --ok-soft:rgba(27,138,80,.1);
    --warn:#A8720C; --warn-soft:rgba(168,114,12,.1);
    --bad:#B8402F; --bad-soft:rgba(184,64,47,.09);
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.09);
    color-scheme:light;
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--f);font-size:15px;line-height:1.55;
    letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.021em}
  h1{font-size:33px;line-height:1.12}
  h2{font-size:21px;line-height:1.25}
  h3{font-size:16px}
  h4{font-size:14px}
  p{margin:0}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;letter-spacing:inherit}
  input,select{font:inherit;letter-spacing:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
  .lab{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text-3);text-transform:uppercase}
  .sec{font-size:12.5px;font-weight:600;color:var(--text-2)}
  .muted{color:var(--text-2)}
  .tiny{font-size:12.5px;color:var(--text-3)}

  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;
    font-size:13.5px;font-weight:500;color:var(--text);
    border:1px solid var(--line-2);background:var(--bg);
    transition:background .13s ease,border-color .13s ease;
  }
  .btn:hover{background:var(--bg-hover)}
  .btn-primary{background:var(--solid);color:var(--solid-text);border-color:var(--solid)}
  .btn-primary:hover{background:var(--solid);opacity:.86}
  .btn-quiet{border-color:transparent;color:var(--text-2)}
  .btn-quiet:hover{background:var(--bg-hover);color:var(--text)}
  .btn-lg{padding:8px 15px;font-size:14px;border-radius:8px}
  .btn:disabled{opacity:.42;cursor:not-allowed}

  .tag{
    display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;
    font-size:12px;font-weight:500;background:var(--bg-hover);color:var(--text-2);white-space:nowrap;
  }
  .tag.live{background:var(--warn-soft);color:var(--warn)}
  .tag.prep{background:var(--bg-hover);color:var(--text-2)}
  .tag.out{background:var(--ok-soft);color:var(--ok)}
  .tag.demo{background:var(--accent-soft);color:var(--accent)}

  hr.div{border:0;border-top:1px solid var(--line);margin:26px 0}

  /* ---------------- shell ---------------- */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:var(--side);flex:none;background:var(--bg-sub);
    padding:10px 8px;display:flex;flex-direction:column;gap:12px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:14px;font-weight:600}
  .brand .mk{
    width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;
    background:var(--solid);color:var(--solid-text);font-size:11px;font-weight:700;
  }
  .brand .tag{margin-left:auto}

  .search{position:relative}
  .search input{
    width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:7px;
    padding:6px 10px 6px 27px;color:var(--text);font-size:13.5px;
  }
  .search input::placeholder{color:var(--text-3)}
  .search input:focus{border-color:var(--accent);outline:none}
  .search::before{content:"⌕";position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px}

  .nav{display:flex;flex-direction:column;gap:1px}
  .nav.m{display:none}
  .nav .lab{padding:10px 8px 4px}
  .nav-item{
    display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:6px;
    font-size:13.5px;color:var(--text-2);transition:background .12s ease,color .12s ease;
  }
  .nav-item:hover{background:var(--bg-hover);color:var(--text)}
  .nav-item[aria-current="true"]{background:var(--bg-hover);color:var(--text);font-weight:500}
  .nav-item .ico{width:18px;text-align:center;flex:none;color:var(--text-3);font-size:13px}
  .nav-item .n{margin-left:auto;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .nav-sub{display:flex;flex-direction:column;gap:1px;margin-left:14px}
  .nav-sub .nav-item{font-size:13px;padding-left:10px;color:var(--text-3)}
  .nav-sub .nav-item:hover,.nav-sub .nav-item[aria-current="true"]{color:var(--text)}

  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px 4px}

  .av{
    border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:10px;font-weight:600;color:#FFF;width:20px;height:20px;letter-spacing:0;
  }

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;gap:10px;height:45px;padding:0 18px;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
    background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);
  }
  .crumb{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-3);min-width:0}
  .crumb button{color:var(--text-2);padding:2px 5px;border-radius:5px}
  .crumb button:hover{background:var(--bg-hover);color:var(--text)}
  .crumb .now{color:var(--text);font-weight:500;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:7px}

  .bell{position:relative;padding:5px 8px;border-radius:7px;color:var(--text-2);font-size:15px}
  .bell:hover{background:var(--bg-hover)}
  .bell .badge{
    position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
    background:var(--bad);color:#FFF;font-size:10px;font-weight:700;display:grid;place-items:center;
    font-family:var(--f-mono);
  }
  .bell .badge[hidden]{display:none}

  .content{padding:38px 54px 90px;max-width:940px;width:100%}
  .view{display:none}
  .view.on{display:block;animation:rise .26s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .note{display:none}
  :root[data-explain="on"] .note{
    display:block;margin-top:26px;padding:14px 16px;border-radius:10px;
    background:var(--accent-soft);font-size:13.5px;line-height:1.62;color:var(--text-2);
  }
  .note b{color:var(--text);font-weight:600}
  .note .lab{color:var(--accent);display:block;margin-bottom:5px}
  .note .mono{color:var(--text)}

  /* ---------------- covers ---------------- */
  .cover{border-radius:8px;overflow:hidden;flex:none;display:block;background:var(--bg-sunken)}
  .cover svg{display:block;width:100%;height:100%}

  /* ---------------- generic page bits ---------------- */
  .page-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .page-sub{color:var(--text-2);margin-top:8px;font-size:15px}
  .head-row{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end}

  .block-h{
    display:flex;align-items:center;gap:10px;margin:34px 0 10px;
  }
  .block-h .line{flex:1}
  .block-h .n{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-top:24px}
  .stat{padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--bg-sunken)}
  .stat .k{font-size:12.5px;color:var(--text-2)}
  .stat .v{font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
  .stat .v.warn{color:var(--warn)}

  /* database-style rows (Notion) */
  .rows{border-top:1px solid var(--line)}
  .row{
    display:grid;grid-template-columns:34px minmax(0,1fr) 112px 118px 66px;
    gap:14px;align-items:center;width:100%;padding:9px 8px;
    border-bottom:1px solid var(--line);transition:background .12s ease;
  }
  .row:hover{background:var(--bg-hover)}
  .row .t{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{font-size:12.5px;color:var(--text-3);margin-top:1px}
  .row .c{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .r{font-size:13px;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums}
  .row .r.near{color:var(--warn);font-weight:500}

  .bar{height:3px;border-radius:3px;background:var(--line-2);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok)}
  .bar-lab{font-size:11.5px;color:var(--text-3);margin-top:4px}

  /* ---------------- artist ---------------- */
  .banner{height:118px;border-radius:12px;overflow:hidden;position:relative}
  .a-avatar{margin:-36px 0 0 6px;position:relative;z-index:2}
  .a-avatar .big{
    width:76px;height:76px;border-radius:50%;border:3px solid var(--bg);
    display:grid;place-items:center;font-size:25px;font-weight:600;color:#FFF;
  }
  .a-name{margin-top:16px;padding-left:6px}
  .a-name .meta{color:var(--text-2);font-size:13.5px;margin-top:5px}

  .tabs{display:flex;gap:2px;margin:26px 0 4px;border-bottom:1px solid var(--line)}
  .tab{
    padding:7px 11px;font-size:13.5px;color:var(--text-2);border-radius:7px 7px 0 0;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab:hover{color:var(--text);background:var(--bg-hover)}
  .tab[aria-selected="true"]{color:var(--text);font-weight:500;border-bottom-color:var(--text)}

  /* property list (Notion) */
  .props{display:flex;flex-direction:column;gap:1px;margin-top:6px}
  .prop{display:grid;grid-template-columns:168px minmax(0,1fr);gap:12px;align-items:baseline;padding:6px 6px;border-radius:6px}
  .prop:hover{background:var(--bg-hover)}
  .prop .k{font-size:13.5px;color:var(--text-3);display:flex;align-items:center;gap:7px}
  .prop .k .ico{width:15px;text-align:center;font-size:12px}
  .prop .v{font-size:14px}
  .prop .v .sub{color:var(--text-3);font-size:12.5px}

  .bio{max-width:66ch;color:var(--text);font-size:15px;line-height:1.68}
  .bio p+p{margin-top:12px}

  .links{display:flex;flex-direction:column;gap:1px;margin-top:4px}
  .link-row{
    display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:center;
    padding:8px 8px;border-radius:8px;width:100%;transition:background .12s ease;
  }
  .link-row:hover{background:var(--bg-hover)}
  .link-row .ic{
    width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    font-size:11px;font-weight:600;color:#FFF;
  }
  .link-row .nm{font-size:14px}
  .link-row .hd{font-size:12.5px;color:var(--text-3)}
  .link-row .go{font-size:13px;color:var(--text-3)}

  /* ---------------- release page ---------------- */
  .r-head{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .r-head .cover{width:112px;height:112px;box-shadow:var(--shadow)}
  .r-head .tags{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}

  .checks{display:flex;flex-direction:column;gap:1px}
  .check{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px}
  .check:hover{background:var(--bg-hover)}
  .check .box{
    width:17px;height:17px;border-radius:50%;flex:none;border:1.5px solid var(--line-2);
    display:grid;place-items:center;font-size:10px;color:#FFF;
  }
  .check.done .box{background:var(--ok);border-color:var(--ok)}
  .check.wip .box{border-color:var(--warn);border-style:dashed}
  .check.miss .box{border-color:var(--line-2)}
  .check .txt{font-size:14px}
  .check.done .txt{color:var(--text-2)}
  .check .due{margin-left:auto;font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .check.wip .due{color:var(--warn)}
  .check.miss .due{color:var(--bad)}

  .mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(182px,1fr));gap:12px;margin-top:6px}
  .mat{
    width:100%;border-radius:10px;overflow:hidden;background:var(--bg);
    border:1px solid var(--line);transition:box-shadow .16s ease,transform .16s ease,border-color .16s ease;
    display:flex;flex-direction:column;
  }
  .mat:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--line-2)}
  .mat .thumb{aspect-ratio:16/10;background:var(--bg-sunken);position:relative;display:grid;place-items:center;overflow:hidden}
  .mat .thumb .cover{width:100%;height:100%;border-radius:0}
  .mat .wave{width:100%;height:100%;display:block}
  .mat .glyph{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.04em}
  .mat .body{padding:10px 11px;display:flex;flex-direction:column;gap:3px}
  .mat .nm{font-size:13px;font-weight:500;line-height:1.35;word-break:break-word}
  .mat .fo{font-size:12px;color:var(--text-3)}
  .kindtag{
    position:absolute;top:7px;left:7px;padding:2px 6px;border-radius:4px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(6px);
    font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--text-2);
  }

  /* threads */
  .thread{border-bottom:1px solid var(--line)}
  .thread-top{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 8px;width:100%;border-radius:8px}
  .thread-top:hover{background:var(--bg-hover)}
  .thread .who{font-size:14px;font-weight:500}
  .thread .prev{font-size:13px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thread .when{font-size:12.5px;color:var(--text-3)}
  .thread-body{display:none;padding:2px 8px 14px 45px;font-size:14px;color:var(--text-2);line-height:1.65}
  .thread.open .thread-body{display:block;animation:fade .18s ease both}
  .extract{
    margin-top:11px;padding:9px 12px;border-radius:8px;background:var(--accent-soft);
    font-size:13px;color:var(--text);
  }

  /* rules */
  .rule{
    display:grid;grid-template-columns:minmax(0,1fr) auto 40px;gap:14px;align-items:center;
    padding:11px 8px;border-bottom:1px solid var(--line);
  }
  .rule .k{font-size:12.5px;color:var(--text-3)}
  .rule .v{font-size:14px;margin-top:3px;word-break:break-word}
  .rule .n{font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .rule.off{opacity:.45}
  .sw{width:38px;height:22px;border-radius:100px;background:var(--line-2);position:relative;flex:none;transition:background .18s ease}
  .sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#FFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s cubic-bezier(.2,.7,.3,1)}
  .sw[aria-pressed="true"]{background:var(--ok)}
  .sw[aria-pressed="true"] i{left:18px}

  .kws{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
  .kw{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;background:var(--bg-hover);font-size:12.5px;color:var(--text-2)}
  .kw button{color:var(--text-3);font-size:13px;line-height:1;padding:0 1px}
  .kw button:hover{color:var(--bad)}
  .kw-add{
    background:transparent;border:1px dashed var(--line-2);border-radius:6px;
    padding:2px 8px;color:var(--text);font-size:12.5px;width:136px;
  }
  .kw-add:focus{border-color:var(--accent);outline:none}

  .orphan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 8px;border-radius:8px}
  .orphan:hover{background:var(--bg-hover)}
  .orphan .p{font-size:12.5px;color:var(--text-3);margin-top:1px}

  /* timeline */
  .track{overflow-x:auto;padding-bottom:6px;margin-top:6px}
  .track-inner{min-width:780px;position:relative}
  .ruler{position:relative;height:18px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .ruler span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .lanes-wrap{position:relative;padding-bottom:20px}
  .lane{position:relative;border-bottom:1px solid var(--line);padding:9px 0}
  .lane:last-child{border-bottom:0}
  .lane-tag{position:absolute;left:0;top:14px;font-size:11.5px;color:var(--text-3);z-index:3}
  .lane-area{position:relative;margin-left:104px;margin-right:12px;min-height:26px}
  .blk{
    position:absolute;top:0;z-index:2;display:inline-flex;align-items:center;gap:7px;
    padding:4px 9px 4px 7px;border-radius:6px;background:var(--bg-sunken);
    border:1px solid var(--line-2);font-size:12.5px;white-space:nowrap;animation:fade .3s ease both;
  }
  .blk::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--text-3);flex:none}
  .blk.a::before{background:var(--accent)}
  .blk.b::before{background:var(--ok)}
  .blk.c::before{background:var(--warn)}
  .blk .d{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}

  /* ================= ART ================= */
  function coverSVG(hue, variant){
    var bg="hsl("+hue+" 24% 13%)", c1="hsl("+hue+" 64% 57%)", c2="hsl("+((hue+30)%360)+" 42% 34%)";
    var body="";
    if(variant===0){ body='<circle cx="118" cy="112" r="74" fill="'+c1+'"/><rect x="150" y="150" width="130" height="130" fill="'+c2+'"/>'; }
    else if(variant===1){ body='<rect x="0" y="62" width="300" height="26" fill="'+c1+'"/><rect x="0" y="114" width="300" height="14" fill="'+c2+'"/><rect x="0" y="154" width="300" height="52" fill="'+c1+'" opacity=".55"/>'; }
    else if(variant===2){ body='<path d="M0 300 L300 0 L300 300 Z" fill="'+c2+'"/><circle cx="86" cy="86" r="42" fill="'+c1+'"/>'; }
    else if(variant===3){ body='<circle cx="150" cy="150" r="112" fill="none" stroke="'+c1+'" stroke-width="14"/><circle cx="150" cy="150" r="72" fill="none" stroke="'+c2+'" stroke-width="14"/><circle cx="150" cy="150" r="26" fill="'+c1+'"/>'; }
    else if(variant===4){ for(var y=0;y<6;y++){ for(var x=0;x<6;x++){ var rr=6+((x*7+y*11)%13); body+='<circle cx="'+(38+x*45)+'" cy="'+(38+y*45)+'" r="'+rr+'" fill="'+(((x+y)%2)?c1:c2)+'"/>'; } } }
    else if(variant===5){ body='<rect x="42" y="0" width="58" height="300" fill="'+c1+'"/><rect x="176" y="0" width="26" height="300" fill="'+c2+'"/>'; }
    else { body='<path d="M150 44 L268 246 L32 246 Z" fill="'+c1+'"/><rect x="0" y="246" width="300" height="54" fill="'+c2+'"/>'; }
    return '<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="copertina"><rect width="300" height="300" fill="'+bg+'"/>'+body+'</svg>';
  }
  function coverNode(r){ var d=el("div","cover"); d.innerHTML=coverSVG(hueOf(r), r.art%7); return d; }

  function deleteRelease(id){
    var r = rel(id);
    if(!r) return;
    if(!confirm('Eliminare definitivamente "'+r.title+'"? Non si può annullare.')) return;
    for(var i=0;i<RELEASES.length;i++){ if(RELEASES[i].id===id){ RELEASES.splice(i,1); break; } }
    saveData();
    flash("Release eliminata");
    renderTree();
    go("home");
  }

  function deleteArtist(id){
    var a = art(id);
    if(!a) return;
    var mine = RELEASES.filter(function(r){ return r.artist===id; });
    var msg = mine.length
      ? ('Eliminare "'+a.name+'"? Verranno eliminate anche le sue '+mine.length+' release. Non si può annullare.')
      : ('Eliminare definitivamente "'+a.name+'"? Non si può annullare.');
    if(!confirm(msg)) return;
    RELEASES = RELEASES.filter(function(r){ return r.artist!==id; });
    for(var i=0;i<ARTISTS.length;i++){ if(ARTISTS[i].id===id){ ARTISTS.splice(i,1); break; } }
    saveData();
    flash("Artista eliminato");
    renderTree();
    go("home");
  }

  function go(view, o){
    o = o || {};
    state.view = view;
    if(o.artist !== undefined) state.artist = o.artist;
    if(o.release !== undefined) state.release = o.release;
    if(o.tab !== undefined) state.tab = o.tab;
    var vs = document.querySelectorAll(".view");
    for(var i=0;i<vs.length;i++){ vs[i].classList.toggle("on", vs[i].getAttribute("data-view")===view); }
    if(view==="home") renderHome();
    if(view==="artist") renderArtist();
    if(view==="release") renderRelease();
    if(view==="integrations") renderIntegrations();
    renderCrumb(); renderTree();
    window.scrollTo({top:0});
  }

  function renderCrumb(){
    var c=$("#crumb"); c.innerHTML="";
    function add(label, fn, now){
      if(c.children.length){ var s=el("span"); s.textContent="/"; s.style.color="var(--text-3)"; c.appendChild(s); }
      if(now){ var n=el("span","now"); n.textContent=label; c.appendChild(n); }
      else { var b=el("button"); b.textContent=label; b.addEventListener("click",fn); c.appendChild(b); }
    }
    if(state.view==="home") add("Panoramica",null,true);
    else if(state.view==="integrations"){ add("Panoramica",function(){go("home");}); add("Integrazioni",null,true); }
    else if(state.view==="artist"){ add("Artisti",function(){go("home");}); add(art(state.artist).name,null,true); }
    else if(state.view==="release"){
      var r=rel(state.release), a=art(r.artist);
      add("Artisti",function(){go("home");});
      add(a.name,function(){ go("artist",{artist:a.id, tab:"release"}); });
      add(r.title,null,true);
    }
  }

  function matchQuery(r){
    if(!state.query) return true;
    var q=state.query;
    return r.title.toLowerCase().indexOf(q)>=0 ||
           art(r.artist).name.toLowerCase().indexOf(q)>=0 ||
           r.mats.some(function(m){ return m.name.toLowerCase().indexOf(q)>=0; });
  }

  function renderTree(){
    var host=$("#navTree"); host.innerHTML="";

    var home=el("button","nav-item");
    home.innerHTML='<span class="ico">◍</span>Panoramica';
    if(state.view==="home") home.setAttribute("aria-current","true");
    home.addEventListener("click",function(){go("home");});
    host.appendChild(home);

    var integ=el("button","nav-item");
    integ.innerHTML='<span class="ico">⇄</span>Integrazioni';
    if(state.view==="integrations") integ.setAttribute("aria-current","true");
    integ.addEventListener("click",function(){go("integrations");});
    host.appendChild(integ);

    var l2=el("span","lab"); l2.textContent="Artisti"; host.appendChild(l2);

    ARTISTS.forEach(function(a){
      var mine=RELEASES.filter(function(r){ return r.artist===a.id && matchQuery(r); });
      if(state.query && !mine.length && a.name.toLowerCase().indexOf(state.query)<0) return;
      var b=el("button","nav-item");
      b.appendChild(avNode(a.initials, a.hue));
      b.appendChild(document.createTextNode(a.name));
      var n=el("span","n"); n.textContent=RELEASES.filter(function(r){return r.artist===a.id;}).length;
      b.appendChild(n);
      if(state.view==="artist" && state.artist===a.id) b.setAttribute("aria-current","true");
      b.addEventListener("click",function(){ go("artist",{artist:a.id, tab:"release"}); });
      host.appendChild(b);

      var sub=el("div","nav-sub");
      mine.forEach(function(r){
        var s=el("button","nav-item");
        s.textContent=r.title;
        if(state.view==="release" && state.release===r.id) s.setAttribute("aria-current","true");
        s.addEventListener("click",function(){ go("release",{release:r.id, artist:a.id}); });
        sub.appendChild(s);
      });
      if(sub.children.length) host.appendChild(sub);
    });
  }

  function recomputeOrphans(r){
    var pulled=0;
    for(var i=r.orphans.length-1;i>=0;i--){
      var o=r.orphans[i];
      var hit=r.rules.kw.some(function(k){
        var kk=k.toLowerCase();
        return o.name.toLowerCase().indexOf(kk)>=0 || (o.need && kk===o.need);
      });
      if(hit){ pullOrphan(r,o.id); pulled++; }
    }
    return pulled;
  }
  function pullOrphan(r,id){
    for(var i=0;i<r.orphans.length;i++){
      if(r.orphans[i].id===id){ var o=r.orphans.splice(i,1)[0]; o.via=["kw"]; r.mats.push(o); saveData(); return; }
    }
  }

  /* ================= TIMELINE ================= */
  var D0=4, D1=21, TD=8;
  function pos(d){ return Math.max(0, Math.min(100, (d-D0)/(D1-D0)*100)); }

  function buildTimeline(r, ruler, lanes){
    ruler.innerHTML=""; lanes.innerHTML="";
    for(var d=D0; d<=D1; d+=2){
      var s=el("span"); s.textContent=d;
      s.style.left="calc(104px + (100% - 116px) * "+(pos(d)/100)+")";
      ruler.appendChild(s);
    }
    var items=[];
    linkedMats(r).forEach(function(m){ if(m.day) items.push({day:m.day, tl:m.tl, lane:0}); });
    r.events.forEach(function(e){ items.push({day:e.day, tl:e.tl, lane:1}); });
    linkedComms(r).forEach(function(c){ items.push({day:c.day, tl:c.tl, lane:2}); });

    var pend=[];
    ["Materiali","Agenda","Scadenze"].forEach(function(name, idx){
      var lane=el("div","lane");
      var tag=el("span","lane-tag"); tag.textContent=name;
      var area=el("div","lane-area");
      var mine=items.filter(function(i){return i.lane===idx;}).sort(function(a,b){return a.day-b.day;});
      var nodes=[];
      mine.forEach(function(i){
        var b=el("div","blk "+(idx===0?"a":idx===1?"b":"c"));
        var n=el("span"); n.textContent=i.tl;
        var dd=el("span","d"); dd.textContent=i.day+" ott";
        b.appendChild(n); b.appendChild(dd);
        area.appendChild(b);
        nodes.push({node:b, day:i.day});
      });
      if(!mine.length){ var e=el("div","lane-empty"); e.textContent="niente in questa corsia"; area.appendChild(e); }
      lane.appendChild(tag); lane.appendChild(area); lanes.appendChild(lane);
      pend.push({area:area, nodes:nodes});
    });

    pend.forEach(function(g){
      var w=g.area.clientWidth, rows=[];
      g.nodes.forEach(function(n){
        var bw=n.node.offsetWidth;
        var x=Math.min(Math.max(0,pos(n.day)/100*w), Math.max(0,w-bw));
        var row=0;
        while(rows[row]!==undefined && x<rows[row]+8){ row++; }
        rows[row]=x+bw;
        n.node.style.left=x+"px";
        n.node.style.top=(row*29)+"px";
      });
      g.area.style.minHeight = rows.length>1 ? (rows.length*29-3)+"px" : "";
    });

    [[TD,"oggi","today","soft"],[20,"USCITA","rel",""]].forEach(function(m){
      var line=el("div","vline "+m[2]);
      line.style.left="calc(104px + (100% - 116px) * "+(pos(m[0])/100)+")";
      lanes.appendChild(line);
      var lab=el("span","vlab "+m[3]); lab.textContent=m[1];
      lab.style.left="calc(104px + (100% - 116px) * "+(pos(m[0])/100)+")";
      lanes.appendChild(lab);
    });
  }

  /* ================= WAVEFORM ================= */
  function seedOf(s){ var n=0; for(var i=0;i<s.length;i++){ n=(n*31+s.charCodeAt(i))%99991; } return n; }
  function drawWave(cv, seedStr, color){
    var ctx=cv.getContext("2d"), w=cv.width, h=cv.height, n=Math.floor(w/4), s=seedOf(seedStr);
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=color;
    for(var i=0;i<n;i++){
      var x=i/n;
      var v=Math.abs(Math.sin(x*11+s%7)*0.45 + Math.sin(x*37+s%13)*0.3 + Math.sin(x*3+s%5)*0.25);
      var env=Math.min(1, Math.sin(Math.PI*Math.min(1,x*1.08))*1.25);
      var bh=Math.max(2, v*env*(h*0.84));
      ctx.fillRect(i*4, (h-bh)/2, 2.4, bh);
    }
  }

    var total=parseInt(parts[0],10)*60+parseInt(parts[1],10);
    var t=0;
    pl.addEventListener("click",function(){
      if(playTimer){ clearInterval(playTimer); playTimer=null; pl.textContent="▶"; return; }
      pl.textContent="❚❚";
      playTimer=setInterval(function(){
        t+=1;
        if(t>=total){ t=0; clearInterval(playTimer); playTimer=null; pl.textContent="▶"; }
        si.style.width=(t/total*100)+"%";
        var mm=Math.floor(t/60), ss=t%60;

      },120);
    });
    return p;

  function escapeDriveQ(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
  function fetchDriveFiles(keywords){
    var token = googleTokens.drive;
    if(!token) return Promise.reject("Drive non collegato");
    var list = Array.isArray(keywords) ? keywords : (keywords ? [keywords] : []);
    list = list.map(function(k){ return (k||"").trim(); }).filter(Boolean);
    var qParts = list.map(function(k){ return "name contains '"+escapeDriveQ(k)+"'"; });
    var q = qParts.length ? ("("+qParts.join(" or ")+") and trashed=false") : "trashed=false";
    var url = "https://www.googleapis.com/drive/v3/files?fields=files(id,name,mimeType,modifiedTime,size,webViewLink)&pageSize=20&q="+encodeURIComponent(q);
    return fetch(url, {headers:{Authorization:"Bearer "+token}})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ throw new Error(d.error.message || "Errore Drive"); }
        return d.files || [];
      });
  }

  function fetchCalendarEvents(timeMin, timeMax){
    var token = googleTokens.calendar;
    if(!token) return Promise.reject("Calendar non collegato");
    var min = timeMin || new Date().toISOString();
    var max = timeMax || new Date(Date.now()+1000*60*60*24*90).toISOString();
    var url = "https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin="+encodeURIComponent(min)+"&timeMax="+encodeURIComponent(max)+"&singleEvents=true&orderBy=startTime&maxResults=25";
    return fetch(url, {headers:{Authorization:"Bearer "+token}})
      .then(function(r){ return r.json(); })
      .then(function(d){ return d.items || []; });
  }

  function fetchGmailMessages(query){
    var token = googleTokens.gmail;
    if(!token) return Promise.reject("Gmail non collegato");
    var q = query ? ("&q="+encodeURIComponent(query)) : "";
    var url = "https://www.googleapis.com/gmail/v1/users/me/messages?maxResults=10"+q;
    return fetch(url, {headers:{Authorization:"Bearer "+token}})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var ids = (d.messages||[]).map(function(m){return m.id;});
        return Promise.all(ids.map(function(id){
          return fetch("https://www.googleapis.com/gmail/v1/users/me/messages/"+id+"?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date",
            {headers:{Authorization:"Bearer "+token}}).then(function(r){return r.json();});
        }));
      });
  }

  function kindFromMime(mime){
    if(!mime) return "DOCUMENTO";
    if(mime.indexOf("audio")>=0) return "AUDIO";
    if(mime.indexOf("video")>=0) return "VIDEO";
    if(mime.indexOf("image")>=0) return "IMMAGINE";
    return "DOCUMENTO";
  }
  function humanSize(bytes){
    if(!bytes) return "";
    bytes = parseInt(bytes,10);
    if(isNaN(bytes)) return "";
    var units=["B","KB","MB","GB"]; var i=0;
    while(bytes>=1024 && i<units.length-1){ bytes/=1024; i++; }
    return bytes.toFixed(1).replace(".0","")+" "+units[i];
  }

  function realScan(title, artistName){
    var out=[]; var jobs=[];
    var terms = [title, artistName].map(function(t){ return (t||"").trim(); }).filter(Boolean);
    if(googleTokens.drive){
      jobs.push(fetchDriveFiles(terms).then(function(files){
        files.forEach(function(f){
          var d = f.modifiedTime ? new Date(f.modifiedTime) : new Date();
          out.push({id:"d-"+f.id, src:"Drive", name:f.name, path:"nel tuo Drive", conf:92,
            kind:kindFromMime(f.mimeType), size:humanSize(f.size),
            when:"modificato il "+d.toLocaleDateString("it-IT"), day:d.getDate(), tl:f.name, meta:[]});
        });
      }));
    }
    if(googleTokens.calendar){
      jobs.push(fetchCalendarEvents().then(function(events){
        events.forEach(function(e){
          var summary=(e.summary||"").toLowerCase();
          var match = !terms.length || terms.some(function(t){ return summary.indexOf(t.toLowerCase())>=0; });
          if(!match) return;
          var startStr = e.start && (e.start.dateTime || e.start.date);
          var d = startStr ? new Date(startStr) : new Date();
          out.push({id:"c-"+e.id, src:"Calendar", name:e.summary||"(senza titolo)", path:d.toLocaleDateString("it-IT"),
            conf:88, kind:"EVENTO", size:"", when:d.toLocaleDateString("it-IT"), day:d.getDate(), tl:e.summary, meta:[]});
        });
      }));
    }
    if(googleTokens.gmail){
      var gq = terms.length ? "("+terms.map(function(t){ return '"'+t.replace(/"/g,'')+'"'; }).join(" OR ")+")" : "";
      jobs.push(fetchGmailMessages(gq).then(function(msgs){
        msgs.forEach(function(m){
          var headers = (m.payload && m.payload.headers) || [];
          function h(n){ var x=headers.filter(function(x){return x.name===n;})[0]; return x?x.value:""; }
          var subj = h("Subject") || "(senza oggetto)";
          var from = h("From") || "";
          out.push({id:"g-"+m.id, src:"Gmail", name:subj, path:from, conf:75, kind:"DOCUMENTO",
            size:"", when:"email trovata", day:new Date().getDate(), tl:subj, meta:["corrispondenza email"]});
        });
      }));
    }
    return Promise.all(jobs).then(function(){ return out; });
  }

  function stepScan(body, title, artistName){
    body.innerHTML="";
    var wrap=el("div","scan");
    var e=el("div","sec"); e.textContent="Analisi in corso";
    var n=el("div","big"); n.textContent="0";
    var sub=el("div","tiny"); sub.textContent="elementi collegabili alla nuova scheda";
    var bar=el("div","pbar"); var bi=el("i"); bar.appendChild(bi);
    var log=el("div","scan-log");
    wrap.appendChild(e); wrap.appendChild(n); wrap.appendChild(sub); wrap.appendChild(bar); wrap.appendChild(log);
    body.appendChild(wrap);

    var connectedAny = !!(googleTokens.drive || googleTokens.calendar || googleTokens.gmail);

    if(!connectedAny){
      SCAN_RESULTS = FOUND;
      var lines=[
        "Nessun servizio Google collegato: mostro dati di esempio",
        "drive.files.list → /MDKEED/Ricomincio da tre/ (demo)",
        "calendar.events.list → finestra 4 nov – 11 dic (demo)",
        'gmail.messages.list → "Ricomincio da tre" OR MDKEED (demo)'
      ];
      var i=0,c=0;
      var timer=setInterval(function(){
        if(i<lines.length){ var s=el("span"); s.textContent=lines[i]; log.appendChild(s); i++; }
        c=Math.min(SCAN_RESULTS.length, c+1);
        n.textContent=c;
        bi.style.width=Math.round(i/lines.length*100)+"%";
        if(i>=lines.length && c>=SCAN_RESULTS.length){
          clearInterval(timer);
          e.textContent="Analisi completata (dati di esempio)";
          var b=el("button","btn btn-primary btn-lg");
          b.textContent="Vedi le "+SCAN_RESULTS.length+" proposte";
          b.addEventListener("click",function(){ stepReview(body); });
          wrap.appendChild(b); b.focus();
        }
      },420);
      return;
    }

    var lines=[];
    var searchLabel = [title, artistName].filter(Boolean).join(" / ");
    if(googleTokens.drive) lines.push('drive.files.list → cerco "'+searchLabel+'" nei tuoi file');
    if(googleTokens.calendar) lines.push("calendar.events.list → prossimi 90 giorni, filtro per titolo/artista");
    if(googleTokens.gmail) lines.push('gmail.messages.list → "'+searchLabel+'" nella tua posta');
    lines.push("unione e ripulitura dei risultati…");

    var li = lines.map(function(l){ var s=el("span"); s.textContent=l; return s; });
    var i=0;
    var logTimer=setInterval(function(){
      if(i<li.length){ log.appendChild(li[i]); bi.style.width=Math.round((i+1)/li.length*85)+"%"; i++; }
      else clearInterval(logTimer);
    }, 380);

    realScan(title, artistName).then(function(results){
      clearInterval(logTimer);
      li.forEach(function(s){ if(!s.parentNode) log.appendChild(s); });
      SCAN_RESULTS = results;
      n.textContent = results.length;
      bi.style.width="100%";
      e.textContent = "Analisi completata";
      var b=el("button","btn btn-primary btn-lg");
      b.textContent = results.length ? ("Vedi le "+results.length+" proposte") : "Nessun elemento trovato — continua comunque";
      b.addEventListener("click",function(){ stepReview(body); });
      wrap.appendChild(b); b.focus();
    }).catch(function(err){
      clearInterval(logTimer);
      e.textContent="La lettura dei dati reali ha dato un errore";
      var msg=el("p","tiny"); msg.style.marginTop="8px"; msg.textContent=String(err);
      wrap.appendChild(msg);
      var b=el("button","btn btn-lg"); b.style.marginTop="10px";
      b.textContent="Continua senza risultati";
      b.addEventListener("click",function(){ SCAN_RESULTS=[]; stepReview(body); });
      wrap.appendChild(b);
    });
  }

  function stepReview(body){
    body.innerHTML="";
    var decided={};
    var head=el("p","tiny"); head.style.marginBottom="14px";
    head.textContent="Niente entra nella scheda finché non lo confermi. Il punteggio dice quanto sono forti i segnali, non quanto siamo sicuri al posto tuo.";
    body.appendChild(head);
    var list=el("div"); body.appendChild(list);
    var foot=el("div","modal-acts"); body.appendChild(foot);

    function draw(){
      list.innerHTML="";
      SCAN_RESULTS.forEach(function(f){
        var d=el("div","prop-row"+(decided[f.id]==="ok"?" done":decided[f.id]==="no"?" skip":""));
        var top=el("div","top");
        var idn=el("div"); idn.style.minWidth="0";
        var nm=el("div","nm"); nm.textContent=f.name;
        var pt=el("div","pt"); pt.textContent=f.src+" · "+f.path;
        idn.appendChild(nm); idn.appendChild(pt);
        top.appendChild(idn);

        var tier=f.conf>=80?"hi":f.conf>=55?"mid":"lo";
        var mt=el("div","conf t-"+tier);
        var segs=el("div","segs");
        var lit=Math.round(f.conf/100*10);
        for(var k=0;k<10;k++){ var si=el("i"); if(k<lit) si.className="on"; segs.appendChild(si); }
        var lab=el("div","lab2");
        var la=el("span"); la.textContent = tier==="hi"?"alta":tier==="mid"?"media":"bassa";
        var lb=el("span","val"); lb.textContent=f.conf+"%";
        lab.appendChild(la); lab.appendChild(lb);
        mt.appendChild(segs); mt.appendChild(lab);
        top.appendChild(mt);
        d.appendChild(top);

        var acts=el("div","acts");
        if(decided[f.id]){
          var stt=el("span","tiny");
          stt.style.color = decided[f.id]==="ok" ? "var(--ok)" : "var(--text-3)";
          stt.textContent = decided[f.id]==="ok" ? "confermato" : "ignorato";
          var un=el("button","btn btn-quiet"); un.textContent="Annulla";
          un.addEventListener("click",function(){ delete decided[f.id]; draw(); });
          acts.appendChild(stt); acts.appendChild(un);
        } else {
          var no=el("button","btn"); no.textContent="Ignora";
          no.addEventListener("click",function(){ decided[f.id]="no"; draw(); });
          var ok=el("button","btn btn-primary"); ok.textContent="Conferma";
          ok.addEventListener("click",function(){ decided[f.id]="ok"; draw(); });
          acts.appendChild(no); acts.appendChild(ok);
        }
        d.appendChild(acts);
        list.appendChild(d);
      });

      foot.innerHTML="";
      var n=Object.keys(decided).filter(function(k){return decided[k]==="ok";}).length;
      var tally=el("span","tiny"); tally.style.marginRight="auto";
      tally.textContent=n+" di "+SCAN_RESULTS.length+" confermati";
      var create=el("button","btn btn-primary btn-lg");
      create.textContent="Crea la scheda";
      create.addEventListener("click",function(){ createRelease(decided); });
      foot.appendChild(tally); foot.appendChild(create);
    }
    draw();
  }

  function createRelease(decided){
    var artId=($("#nrArt")&&$("#nrArt").value)||"mdkeed";
    var title=($("#nrTit")&&$("#nrTit").value)||"Ricomincio da tre";
    var type =($("#nrTip")&&$("#nrTip").value)||"Singolo";
    var date =($("#nrDat")&&$("#nrDat").value)||"4 dicembre 2026";
    var id="new-"+RELEASES.length;
    var mats=[], events=[];
    SCAN_RESULTS.forEach(function(f){
      if(decided[f.id]!=="ok") return;
      if(f.kind==="EVENTO"){ events.push({id:f.id, day:f.day, tl:f.tl}); }
      else { mats.push({id:f.id, kind:f.kind, name:f.name, size:f.size, when:f.when, path:f.path,
                        via:["folder","kw"], day:f.day, tl:f.tl, dur:f.dur, meta:f.meta}); }
    });
    RELEASES.push({
      id:id, artist:artId, title:title, type:type, date:date, t:57, status:"prep", art:RELEASES.length%7,
      distributor:"Believe", isrc:"da assegnare", label:art(artId).label, team:[],
      rules:{kw:[title], folder:"/"+art(artId).name+"/"+title+"/", people:[], window:"1 nov – 11 dic 2026"},
      checks:[
        {t:"Cover conforme 3000×3000", s: mats.some(function(m){return m.kind==="IMMAGINE";})?"done":"miss"},
        {t:"Metadata e ISRC", s:"miss"},
        {t:"Press kit", s:"miss"},
        {t:"Master alla distribuzione", s: mats.some(function(m){return m.kind==="AUDIO";})?"wip":"miss"},
        {t:"Pitch alle piattaforme", s:"miss"},
        {t:"Piano social", s:"miss"}
      ],
      mats:mats, orphans:[], events:events, comms:[]
    });
    saveData();
    closeModal();
    go("release",{release:id, artist:artId});
    flash("Scheda creata con "+mats.length+" materiali e "+events.length+" eventi");
  }

  /* ================= NUOVO ARTISTA ================= */
  function newArtistModal(){
    var m=$("#modal"); m.innerHTML="";
    var top=el("div","modal-top");
    var l=el("h4"); l.textContent="Nuovo artista";
    var c=el("button","btn btn-quiet"); c.textContent="Chiudi"; c.addEventListener("click", closeModal);
    top.appendChild(l); top.appendChild(c);
    m.appendChild(top);
    var body=el("div","modal-body");
    m.appendChild(body);

    var p=el("p","tiny"); p.style.marginBottom="16px";
    p.textContent="Compila i dati base. Potrai aggiungere bio, piattaforme e documenti in seguito.";
    body.appendChild(p);

    var f1=el("div","field");
    f1.innerHTML='<label for="naNome">Nome d\'arte</label><input id="naNome" placeholder="es. Nome Artista">';
    body.appendChild(f1);

    var row=el("div","row2");
    var f2=el("div","field");
    f2.innerHTML='<label for="naGenere">Genere</label><input id="naGenere" placeholder="es. Pop">';
    var f3=el("div","field");
    f3.innerHTML='<label for="naCitta">Città</label><input id="naCitta" placeholder="es. Roma">';
    row.appendChild(f2); row.appendChild(f3); body.appendChild(row);

    var f4=el("div","field");
    f4.innerHTML='<label for="naLabel">Etichetta</label><input id="naLabel" placeholder="es. Indipendente" value="Indipendente">';
    body.appendChild(f4);

    var acts=el("div","modal-acts");
    var g=el("button","btn btn-primary btn-lg");
    g.textContent="Crea artista";
    g.addEventListener("click",function(){
      var nome=($("#naNome").value||"").trim();
      if(!nome){ $("#naNome").focus(); return; }
      var id = nome.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || ("artista-"+Date.now());
      if(art(id)){ id = id+"-"+Date.now(); }
      var iniz = nome.split(/\s+/).map(function(w){return w[0]||"";}).join("").slice(0,2).toUpperCase();
      ARTISTS.push({
        id:id, name:nome, legal:nome, initials:iniz||"?", hue: Math.floor(Math.random()*360),
        genre:($("#naGenere").value||"").trim()||"da definire",
        city:($("#naCitta").value||"").trim()||"",
        from:String(new Date().getFullYear()),
        label:($("#naLabel").value||"Indipendente").trim(),
        booking:"", press:"da assegnare", manager:"tu",
        bio:[], platforms:[], docs:[], note:""
      });
      saveData();
      closeModal();
      renderTree();
      flash("Artista "+nome+" creato");
      go("artist",{artist:id});
    });
    acts.appendChild(g); body.appendChild(acts);
    $("#overlay").classList.add("on");
  }

  /* ================= EVENTS ================= */
  $("#bellBtn").addEventListener("click", openDrawer);
  $("#closeDrawer").addEventListener("click", closeDrawer);
  $("#scrim").addEventListener("click", closeDrawer);
  $("#newBtn").addEventListener("click", newReleaseModal);
  $("#newArtistBtn").addEventListener("click", newArtistModal);
  $("#resetBtn").addEventListener("click", function(){
    if(confirm("Sicuro di voler cancellare tutti i tuoi dati salvati e tornare alla demo iniziale?")){
      localStorage.removeItem(STORE_KEY);
      location.reload();
    }
  });
  $("#overlay").addEventListener("click", function(e){ if(e.target===this) closeModal(); });
  $("#viewerOv").addEventListener("click", function(e){ if(e.target===this) closeViewer(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeModal(); closeViewer(); closeDrawer(); } });
  document.addEventListener("click", function(e){
    var t=e.target.closest("[data-nav]");
    if(t) go(t.getAttribute("data-nav"));
  });
  $("#q").addEventListener("input", function(){
    state.query=this.value.trim().toLowerCase();
    renderTree();
    if(state.view==="home") renderHome();
  });
  $("#explainBtn").addEventListener("click", function(){
    var on=document.documentElement.getAttribute("data-explain")==="on";
    document.documentElement.setAttribute("data-explain", on?"off":"on");
    this.setAttribute("aria-pressed", on?"false":"true");
    this.style.color = on ? "" : "var(--accent)";
  });

  renderBadge();
  go("home");
})();
</script>
